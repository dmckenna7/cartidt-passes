name: _unittest

data:
  name: iwoai
  root: ./tests/regression/_fixtures
  manifests_dir: ./tests/regression/_fixtures
  target_shape: [8, 32, 32]
  batch_size: 1
  num_workers: 0
  augment:
    rotation_deg: 0.0
    scale_lo: 1.0
    scale_hi: 1.0
    translate_voxels: 0
    elastic_sigma: 0.0
    elastic_alpha: 0.0
    noise_std: 0.0
    gain_lo: 1.0
    gain_hi: 1.0

model:
  use_tiny_vit: true
  weights: tiny
  pretrained: false
  embed_dim: 32
  patch_size: 16
  depth_stride: 2
  lora_rank: 4
  lora_alpha: 8
  target_hw: [32, 32]
  target_depth: 8
  tap_layers: [0, 1, 2, 3]
  tiny_depth: 4
  tiny_num_heads: 4
  decoder_dim: 16
  ppm_scales: [1, 2, 3]
  num_seg_classes: 4
  num_grades: 4
  sage_hidden: 32
  sage_layers: 2
  evidence_hidden: 16
  default_edge_weight: 0.5

train:
  seed: 0
  epochs: 1
  warmup_epochs: 1
  anneal_epochs: 2
  base_lr: 5.0e-3
  min_lr: 1.0e-6
  weight_decay: 1.0e-3
  betas: [0.9, 0.999]
  grad_accum: 1
  max_grad_norm: 1.0
  precision: fp32
  mu: 0.5
