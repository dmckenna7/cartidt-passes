name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy --strict cartidt

      - name: Pytest (fast suite)
        run: pytest tests/shape tests/regression -q -n auto
