[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartidt"
version = "0.1.0"
description = "CartiDT: cross-modal foundation-model transfer with a biomechanically-informed digital twin and evidential uncertainty for knee cartilage damage detection."
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "CartiDT authors" }]
readme = "README.md"

dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "timm==0.9.16",
    "einops==0.7.0",
    "omegaconf==2.3.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "statsmodels==0.14.1",
    "monai==1.3.0",
    "nibabel==5.2.0",
    "SimpleITK==2.3.1",
    "tqdm==4.66.2",
    "tensorboard==2.16.2",
    "pandas==2.1.4",
    "matplotlib==3.8.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.3.4",
    "black==24.3.0",
    "isort==5.13.2",
    "mypy==1.9.0",
    "pytest==8.1.1",
    "pytest-xdist==3.5.0",
    "pre-commit==3.6.2",
]

[project.scripts]
cartidt-train = "cartidt.driver.train:main"
cartidt-evaluate = "cartidt.driver.evaluate:main"
cartidt-infer = "cartidt.driver.infer:main"
cartidt-export = "cartidt.driver.export_onnx:main"

[tool.setuptools.packages.find]
include = ["cartidt*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["tests/regression/_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["cartidt"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["cartidt"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["cartidt"]
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["monai.*", "nibabel.*", "SimpleITK.*", "timm.*", "statsmodels.*", "einops.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (use --runslow to enable)",
]
